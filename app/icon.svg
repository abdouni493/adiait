<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ordre des Chevaliers">
  <!-- L'écusson tient dans un carré arrondi sombre : à 16 px, c'est le
       contraste du fond qui rend la silhouette dorée lisible dans l'onglet. -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223a"/>
      <stop offset="1" stop-color="#070d16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2e0ae"/>
      <stop offset="0.5" stop-color="#d9b45f"/>
      <stop offset="1" stop-color="#a8842f"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#steel)"/>

  <!-- Le blason -->
  <path
    d="M32 9 L52 16 V32 C52 43.5 43.4 51.6 32 55.5 C20.6 51.6 12 43.5 12 32 V16 Z"
    fill="url(#gold)"/>

  <!-- L'épée, taillée EN CREUX dans l'or : une seule forme pleine reste
       nette une fois l'icône réduite à 16 px. -->
  <path
    d="M32 17.5 L34.6 21 V31.5 H40.5 V35.5 H34.6 V47.5 H29.4 V35.5 H23.5 V31.5 H29.4 V21 Z"
    fill="#0b1220"/>
</svg>
